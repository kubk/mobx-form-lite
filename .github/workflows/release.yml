name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: $/.github/workflows/node.js.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      # Full history and tags let the release notes list commits since the previous tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Releases skip the Actions cache so a poisoned cache entry cannot reach the published package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Publish
        run: |
          spec=$(node -p "const p = require('./package.json'); p.name + '@' + p.version")
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log --reverse --invert-grep --grep '^Release ' \
            --format="- [%s]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H)" "$prev..$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
